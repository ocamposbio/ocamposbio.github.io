<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0d0b">
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
  <style>
    body {
      margin: 0; padding: 0;
      background: #0a0d0b; color: #d5e2d8;
      font-family: "JetBrains Mono", ui-monospace, Consolas, monospace;
    }
    a { color: #3dff9e; }
  </style>
  <link rel="stylesheet" href="{{ '/assets/css/main.css?v=3' | relative_url }}">
  <script>
    (function () {
      var t = 'dark';
      try { t = localStorage.getItem('theme') || 'dark'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <div class="shell">
    <nav class="topbar">
      <span class="path">~/{{ site.author }}<span class="path-muted">:$</span> <span class="cursor">▊</span></span>
      <div class="topbar-right">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Trocar tema">theme: <span id="theme-label"></span></button>
        <a class="link" href="https://github.com/{{ site.author }}">github</a>
        <a class="link" href="mailto:hi@{{ site.author }}.github.io">email</a>
      </div>
    </nav>

    {{ content }}

    <footer class="footer">
      <span><span class="prompt">$</span> exit — {{ site.author }} © 2026</span>
      <nav class="footer-nav">
        <a href="{{ '/' | relative_url }}">/</a>
      </nav>
    </footer>
  </div>

  <script>
    (function () {
      var root = document.documentElement;
      var label = document.getElementById('theme-label');
      var btn = document.getElementById('theme-toggle');
      var metaTheme = document.querySelector('meta[name="theme-color"]');
      var colors = { dark: '#0a0d0b', light: '#f3f4ee' };
      function render() {
        label.textContent = root.getAttribute('data-theme');
        if (metaTheme) metaTheme.setAttribute('content', colors[root.getAttribute('data-theme')] || colors.dark);
      }
      btn.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        render();
      });
      render();
    })();
  </script>
</body>
</html>
